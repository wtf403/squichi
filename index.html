<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>squichi</title>
<style>
  :root {
    --titlebar-height: 44px;
    --window-radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000 url('bg.jpg') center / cover no-repeat fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .window-container {
    position: fixed;
    width: min(80vw, 1400px);
    height: min(80vh, 920px);
    min-width: 400px;
    min-height: 300px;
    left: 10vw;
    top: 10vh;
    user-select: none;
    -webkit-user-select: none;
  }

  .window {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: var(--window-radius);
    overflow: hidden;
    isolation: isolate;
    background: rgba(18, 17, 15, 0.10);
    box-shadow:
      0 24px 90px rgba(0, 0, 0, 0.46),
      0 0 0 1px rgba(255, 255, 255, 0.24) inset,
      0 1px 0 rgba(255, 255, 255, 0.18) inset;
  }

  /* The app canvas is the bottom layer and is clipped by .window. */
  .content {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  #c,
  #glass {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  #c {
    z-index: 1;
    touch-action: none;
    /*cursor: grab;*/
  }

  #c.dragging { cursor: grabbing; }

  /* Lens overlay stays over the canvas but never steals scrolling/panning input. */
  #glass {
    z-index: 2;
    pointer-events: none;
    border-radius: inherit;
  }

  .titlebar {
    position: absolute;
    inset: 0 0 auto;
    height: var(--titlebar-height);
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0.07), rgba(255,255,255,0));
  }

  /*.window-container.is-moving .titlebar { cursor: grabbing; }*/

  /* Controls are INSIDE the clipped app/window canvas, not at top:-30px. */
  .controls {
    position: absolute;
    top: 14px;
    left: 16px;
    z-index: 10;
    display: flex;
    gap: 8px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 160ms ease, transform 160ms ease;
    padding: 8px;
    margin: -8px;
    pointer-events: auto;
  }

  .controls:hover {
    opacity: 1;
    transform: translateY(0);
  }

  .control {
    width: 12px;
    height: 12px;
    border: 0;
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18) inset, 0 1px 2px rgba(0, 0, 0, 0.24);
    transition: filter 0.18s ease, transform 0.18s ease;
  }

  .control:hover { filter: brightness(0.86); transform: scale(1.08); }
  .control:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  .control.close { background: #fc605b; }
  .control.minimize { background: #fecb2e; }
  .control.expand { background: #2aca3e; }

  .resize-handle {
    position: absolute;
    z-index: 5;
    touch-action: none;
  }

  .resize-handle.nw { top: 0; left: 0; width: 16px; height: 16px; cursor: nw-resize; }
  .resize-handle.ne { top: 0; right: 0; width: 16px; height: 16px; cursor: ne-resize; }
  .resize-handle.sw { bottom: 0; left: 0; width: 16px; height: 16px; cursor: sw-resize; }
  .resize-handle.se { right: 0; bottom: 0; width: 16px; height: 16px; cursor: se-resize; }
  .resize-handle.n { top: 0; right: 16px; left: 16px; height: 12px; cursor: n-resize; }
  .resize-handle.s { right: 16px; bottom: 0; left: 16px; height: 12px; cursor: s-resize; }
  .resize-handle.w { top: 16px; bottom: 16px; left: 0; width: 12px; cursor: w-resize; }
  .resize-handle.e { top: 16px; right: 0; bottom: 16px; width: 12px; cursor: e-resize; }

  @media (max-width: 480px), (max-height: 380px) {
    .window-container {
      min-width: 0;
      min-height: 0;
      width: 100vw;
      height: 100vh;
      left: 0 !important;
      top: 0 !important;
    }
    .window { border-radius: 0; }
  }
</style>
</head>
<body>
  <div class="window-container" id="windowContainer">
    <div class="window" id="appWindow">
      <div class="content" id="content">
        <canvas id="c" aria-label="Scrollable image canvas"></canvas>
        <canvas id="glass" aria-hidden="true"></canvas>
      </div>

      <div class="titlebar" id="titlebar" aria-label="Drag window"></div>

      <div class="controls" aria-label="Window controls">
        <button class="control close" type="button" aria-label="Close"></button>
        <button class="control minimize" type="button" aria-label="Minimize"></button>
        <button class="control expand" type="button" aria-label="Toggle fullscreen"></button>
      </div>

      <div class="resize-handle nw" data-direction="nw"></div>
      <div class="resize-handle ne" data-direction="ne"></div>
      <div class="resize-handle sw" data-direction="sw"></div>
      <div class="resize-handle se" data-direction="se"></div>
      <div class="resize-handle n" data-direction="n"></div>
      <div class="resize-handle s" data-direction="s"></div>
      <div class="resize-handle w" data-direction="w"></div>
      <div class="resize-handle e" data-direction="e"></div>
    </div>
  </div>

  <script>
  'use strict';

  const container = document.getElementById('windowContainer');
  const appWindow = document.getElementById('appWindow');
  const content = document.getElementById('content');
  const titlebar = document.getElementById('titlebar');
  const cv = document.getElementById('c');
  const glassCanvas = document.getElementById('glass');
  const ctx = cv.getContext('2d');

  let W = 0;
  let H = 0;
  let DPR = 1;
  let vignette = null;

  /* ===================== WebGL edge lens =====================
     The glass canvas re-renders the main 2D canvas as a texture.
     A concave lens profile is applied only inside a 25px border
     band (rounded-rect SDF), pulling sample UVs inward so edge
     content appears stretched outward. The main canvas itself is
     hidden (opacity 0) so there is no double blending; it still
     receives all pointer input. */
  const LENS_BORDER = 8;  // css px band width
  const LENS_STRENGTH = 8; // css px max inward sample shift

  let lensGL = null;
  let lensTex = null;
  let lensUniforms = null;

  const lensVertexSrc = [
    'attribute vec2 a_pos;',
    'varying vec2 v_uv;',
    'void main() {',
    '  v_uv = a_pos * 0.5 + 0.5;',
    '  gl_Position = vec4(a_pos, 0.0, 1.0);',
    '}'
  ].join('\n');

  const lensFragmentSrc = [
    'precision mediump float;',
    'varying vec2 v_uv;',
    'uniform sampler2D u_src;',
    'uniform vec2 u_res;',       // device px
    'uniform float u_border;',   // device px
    'uniform float u_radius;',   // device px
    'uniform float u_strength;', // device px, max smear reach along the edge
    '',
    'float roundBoxSD(vec2 p, vec2 b, float r) {',
    '  vec2 q = abs(p) - b + r;',
    '  return min(max(q.x, q.y), 0.0) + length(max(q, vec2(0.0))) - r;',
    '}',
    '',
    'void main() {',
    '  vec2 frag = v_uv * u_res;',
    '  vec2 c = frag - u_res * 0.5;',
    '  float d = -roundBoxSD(c, u_res * 0.5, u_radius); // distance inward from border',
    '',
    '  if (d >= u_border) {',
    '    vec4 s = texture2D(u_src, v_uv);',
    '    gl_FragColor = vec4(s.rgb * s.a, s.a);',
    '    return;',
    '  }',
    '',
    '  float t = 1.0 - clamp(d / u_border, 0.0, 1.0); // 0 inner rim -> 1 at border',
    '',
    '  // outward normal of the border, rotated 90deg -> direction ALONG the edge',
    '  vec2 b = u_res * 0.5 - u_radius;',
    '  vec2 q = abs(c) - b;',
    '  vec2 nrm;',
    '  if (q.x > 0.0 && q.y > 0.0) nrm = sign(c) * normalize(q);',
    '  else if (q.x > q.y) nrm = vec2(sign(c.x), 0.0);',
    '  else nrm = vec2(0.0, sign(c.y));',
    '  vec2 tangent = vec2(-nrm.y, nrm.x);',
    '',
    '  // symmetric multi-tap smear along the edge (both directions)',
    '  float reach = u_strength * smoothstep(0.0, 0.45, t); // how far the smear extends',
    '  vec4 sharp = texture2D(u_src, v_uv);',
    '  vec3 acc = vec3(0.0);',
    '  float aw = 0.0;',
    '  float alphaAcc = 0.0;',
    '  for (int i = -6; i <= 6; i++) {',
    '    float fi = float(i) / 6.0;',
    '    float w = 1.0 - abs(fi) * 0.55; // soft falloff toward smear tails',
    '    vec2 off = tangent * (fi * reach) / u_res;',
    '    vec4 s = texture2D(u_src, v_uv + off);',
    '    acc += s.rgb * w;',
    '    alphaAcc += s.a * w;',
    '    aw += w;',
    '  }',
    '  vec3 smearCol = acc / aw;',
    '  float smearA = alphaAcc / aw;',
    '',
    '  // sharp near the inner rim, fully smeared at the border',
    '  float mixAmt = smoothstep(0.05, 0.7, t);',
    '  vec3 col = mix(sharp.rgb, smearCol, mixAmt);',
    '  float a = mix(sharp.a, smearA, mixAmt);',
    '',
    '  col *= 1.0 + 0.08 * sin(t * 3.14159);       // soft band shading',
    '  col += vec3(0.10) * smoothstep(0.85, 1.0, t); // bright rim line',
    '',
    '  gl_FragColor = vec4(col * a, a);',
    '}'
  ].join('\n');

  function initLens() {
    const gl = glassCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: true });
    if (!gl) return false;

    function compile(type, src) {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error('Lens shader error:', gl.getShaderInfoLog(sh));
        return null;
      }
      return sh;
    }

    const vs = compile(gl.VERTEX_SHADER, lensVertexSrc);
    const fs = compile(gl.FRAGMENT_SHADER, lensFragmentSrc);
    if (!vs || !fs) return false;

    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Lens link error:', gl.getProgramInfoLog(prog));
      return false;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    lensTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, lensTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    lensUniforms = {
      res: gl.getUniformLocation(prog, 'u_res'),
      border: gl.getUniformLocation(prog, 'u_border'),
      radius: gl.getUniformLocation(prog, 'u_radius'),
      strength: gl.getUniformLocation(prog, 'u_strength')
    };

    lensGL = gl;
    // The glass canvas becomes the visual output; keep #c interactive only.
    cv.style.opacity = '0';
    return true;
  }

  function renderLens() {
    if (!lensGL || !W || !H) return;
    const gl = lensGL;

    const cw = cv.width;
    const ch = cv.height;
    if (glassCanvas.width !== cw || glassCanvas.height !== ch) {
      glassCanvas.width = cw;
      glassCanvas.height = ch;
    }

    gl.viewport(0, 0, cw, ch);
    gl.bindTexture(gl.TEXTURE_2D, lensTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);

    gl.uniform2f(lensUniforms.res, cw, ch);
    gl.uniform1f(lensUniforms.border, LENS_BORDER * DPR);
    gl.uniform1f(lensUniforms.radius, 16 * DPR); // matches --window-radius
    gl.uniform1f(lensUniforms.strength, LENS_STRENGTH * DPR);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function resizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = content.clientWidth;
    H = content.clientHeight;

    if (!W || !H) return;

    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const g = ctx.createRadialGradient(
      W / 2, H / 2, Math.min(W, H) * 0.36,
      W / 2, H / 2, Math.hypot(W, H) * 0.58
    );
    g.addColorStop(0, 'rgba(58,52,42,0)');
    g.addColorStop(1, 'rgba(58,52,42,.08)');
    vignette = g;
  }

  function getBounds() {
    return {
      minWidth: Math.min(400, window.innerWidth),
      minHeight: Math.min(300, window.innerHeight),
      maxWidth: window.innerWidth,
      maxHeight: window.innerHeight
    };
  }

  function clampWindowToViewport() {
    const rect = container.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;
    const left = Math.max(0, Math.min(rect.left, window.innerWidth - width));
    const top = Math.max(0, Math.min(rect.top, window.innerHeight - height));
    container.style.left = left + 'px';
    container.style.top = top + 'px';
  }

  function canvasPoint(event) {
    const rect = cv.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  /* Window dragging: pointer events prevent mouse/touch coordinate mismatches. */
  let moving = null;

  /* Resizing remains inside the app boundary, while the container itself is clamped to the viewport. */
  let resizing = null;
  let dragIntent = null; // Track initial drag intent

  document.querySelectorAll('.resize-handle').forEach((handle) => {
    handle.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;

      const rect = container.getBoundingClientRect();
      const direction = handle.dataset.direction;

      // Store initial state, wait for movement to determine intent
      dragIntent = {
        pointerId: event.pointerId,
        direction: direction,
        startX: event.clientX,
        startY: event.clientY,
        width: rect.width,
        height: rect.height,
        left: rect.left,
        top: rect.top,
        determined: false
      };

      handle.setPointerCapture(event.pointerId);
      event.preventDefault();
      event.stopPropagation();
    });

    handle.addEventListener('pointermove', (event) => {
      // Handle already-determined moving
      if (moving && moving.pointerId === event.pointerId) {
        const rect = container.getBoundingClientRect();
        const left = Math.max(0, Math.min(moving.left + event.clientX - moving.startX, window.innerWidth - rect.width));
        const top = Math.max(0, Math.min(moving.top + event.clientY - moving.startY, window.innerHeight - rect.height));
        container.style.left = left + 'px';
        container.style.top = top + 'px';
        return;
      }

      // Determine intent on first significant movement
      if (dragIntent && !dragIntent.determined && dragIntent.pointerId === event.pointerId) {
        const dx = Math.abs(event.clientX - dragIntent.startX);
        const dy = Math.abs(event.clientY - dragIntent.startY);
        const threshold = 5; // pixels of movement before deciding

        if (dx > threshold || dy > threshold) {
          const d = dragIntent.direction;
          let shouldMove = false;

          // Check if movement is perpendicular to the edge
          if (d === 'n' || d === 's') {
            // Top/bottom edges: if horizontal movement is dominant, move instead of resize
            shouldMove = dx > dy;
          } else if (d === 'e' || d === 'w') {
            // Left/right edges: if vertical movement is dominant, move instead of resize
            shouldMove = dy > dx;
          } else if (d === 'nw' || d === 'ne' || d === 'sw' || d === 'se') {
            // Corners: always resize (no perpendicular movement)
            shouldMove = false;
          }

          dragIntent.determined = true;

          if (shouldMove) {
            // Switch to move mode
            moving = {
              pointerId: dragIntent.pointerId,
              startX: dragIntent.startX,
              startY: dragIntent.startY,
              left: dragIntent.left,
              top: dragIntent.top
            };
            container.classList.add('is-moving');
            dragIntent = null;
            return;
          } else {
            // Switch to resize mode
            resizing = {
              pointerId: dragIntent.pointerId,
              direction: dragIntent.direction,
              startX: dragIntent.startX,
              startY: dragIntent.startY,
              width: dragIntent.width,
              height: dragIntent.height,
              left: dragIntent.left,
              top: dragIntent.top
            };
            dragIntent = null;
            // Continue to resize handling below
          }
        } else {
          return; // Not enough movement yet
        }
      }

      // Handle resizing
      if (!resizing || resizing.pointerId !== event.pointerId) return;

      const { minWidth, minHeight, maxWidth, maxHeight } = getBounds();
      const dx = event.clientX - resizing.startX;
      const dy = event.clientY - resizing.startY;
      const d = resizing.direction;
      let width = resizing.width;
      let height = resizing.height;
      let left = resizing.left;
      let top = resizing.top;

      if (d.includes('e')) width = Math.max(minWidth, Math.min(maxWidth - left, resizing.width + dx));
      if (d.includes('s')) height = Math.max(minHeight, Math.min(maxHeight - top, resizing.height + dy));

      if (d.includes('w')) {
        const nextLeft = Math.max(0, Math.min(resizing.left + dx, resizing.left + resizing.width - minWidth));
        left = nextLeft;
        width = Math.max(minWidth, Math.min(maxWidth, resizing.width + resizing.left - left));
      }

      if (d.includes('n')) {
        const nextTop = Math.max(0, Math.min(resizing.top + dy, resizing.top + resizing.height - minHeight));
        top = nextTop;
        height = Math.max(minHeight, Math.min(maxHeight, resizing.height + resizing.top - top));
      }

      container.style.width = width + 'px';
      container.style.height = height + 'px';
      container.style.left = left + 'px';
      container.style.top = top + 'px';
      resizeCanvas();
    });

    const stop = (event) => {
      if (resizing && resizing.pointerId === event.pointerId) {
        resizing = null;
      }
      if (moving && moving.pointerId === event.pointerId) {
        moving = null;
        container.classList.remove('is-moving');
      }
      if (dragIntent && dragIntent.pointerId === event.pointerId) {
        dragIntent = null;
      }
    };
    handle.addEventListener('pointerup', stop);
    handle.addEventListener('pointercancel', stop);
  });

  window.addEventListener('resize', () => {
    clampWindowToViewport();
    resizeCanvas();
  });

  new ResizeObserver(resizeCanvas).observe(content);

  const PAD = 1;
  const BAND = 50;

  function axisMap(s, r) {
    const c = r - BAND;
    const a = Math.abs(s);
    if (a <= c) return s;
    const u = a - c;
    return Math.sign(s) * (c + BAND * u / (BAND + u));
  }

  function axisUnmap(v, r) {
    const c = r - BAND;
    const a = Math.abs(v);
    if (a <= c) return v;
    const w = Math.min(a - c, BAND * 0.999);
    return Math.sign(v) * (c + w * BAND / (BAND - w));
  }

  function mapPoint(wx, wy, out) {
    out.x = W * 0.5 + axisMap((wx - cam.x) * cam.zoom, W * 0.5 * PAD);
    out.y = H * 0.5 + axisMap((wy - cam.y) * cam.zoom, H * 0.5 * PAD);
  }

  const TMP = { x: 0, y: 0 };
  const cam = { x: 140, y: -80, zoom: 1, vx: 0, vy: 0 };

  let drag = null;
  const ptrs = new Map();
  let pinch = null;

  function pinchState() {
    const a = [...ptrs.values()];
    return {
      cx: (a[0].x + a[1].x) / 2,
      cy: (a[0].y + a[1].y) / 2,
      span: Math.max(20, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y))
    };
  }

  cv.addEventListener('pointerdown', (event) => {
    const p = canvasPoint(event);
    ptrs.set(event.pointerId, p);

    if (ptrs.size === 1) {
      drag = { id: event.pointerId, x: p.x, y: p.y, t: performance.now() };
      cam.vx = cam.vy = 0;
      cv.classList.add('dragging');
    } else {
      drag = null;
      cam.vx = cam.vy = 0;
      pinch = pinchState();
      cv.classList.remove('dragging');
    }

    cv.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  cv.addEventListener('pointermove', (event) => {
    const p = ptrs.get(event.pointerId);
    if (!p) return;

    const next = canvasPoint(event);
    p.x = next.x;
    p.y = next.y;

    if (ptrs.size >= 2) {
      if (!pinch) pinch = pinchState();
      const s = pinchState();
      cam.x -= (s.cx - pinch.cx) / cam.zoom;
      cam.y -= (s.cy - pinch.cy) / cam.zoom;

      const rx = W * 0.5 * PAD;
      const ry = H * 0.5 * PAD;
      const sx = axisUnmap(s.cx - W * 0.5, rx);
      const sy = axisUnmap(s.cy - H * 0.5, ry);
      const z1 = Math.min(4, Math.max(0.25, cam.zoom * s.span / pinch.span));

      cam.x += sx * (1 / cam.zoom - 1 / z1);
      cam.y += sy * (1 / cam.zoom - 1 / z1);
      cam.zoom = z1;
      pinch = s;
    } else if (drag && event.pointerId === drag.id) {
      const now = performance.now();
      const dt = Math.max(4, now - drag.t) / 1000;
      const dx = next.x - drag.x;
      const dy = next.y - drag.y;

      cam.x -= dx / cam.zoom;
      cam.y -= dy / cam.zoom;
      cam.vx += (-dx / cam.zoom / dt - cam.vx) * 0.4;
      cam.vy += (-dy / cam.zoom / dt - cam.vy) * 0.4;
      drag.x = next.x;
      drag.y = next.y;
      drag.t = now;
    }
  });

  function endPointer(event) {
    ptrs.delete(event.pointerId);
    pinch = null;

    if (drag && event.pointerId === drag.id) {
      drag = null;
      cv.classList.remove('dragging');
      if (ptrs.size === 1) {
        const [id] = ptrs.keys();
        const q = ptrs.get(id);
        drag = { id, x: q.x, y: q.y, t: performance.now() };
        cv.classList.add('dragging');
      }
    } else if (ptrs.size === 0) {
      cv.classList.remove('dragging');
    }
  }

  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);

  /* Critical fix: use canvas-local coordinates, not viewport clientX/clientY. */
  cv.addEventListener('wheel', (event) => {
    event.preventDefault();
    const p = canvasPoint(event);

    if (event.ctrlKey || event.metaKey) {
      let delta = event.deltaY;
      if (event.deltaMode === 1) delta *= 33;

      const rx = W * 0.5 * PAD;
      const ry = H * 0.5 * PAD;
      const sx = axisUnmap(p.x - W * 0.5, rx);
      const sy = axisUnmap(p.y - H * 0.5, ry);
      const z0 = cam.zoom;
      const z1 = Math.min(4, Math.max(0.25, z0 * Math.exp(-delta * 0.005)));

      if (z1 !== z0) {
        cam.x += sx * (1 / z0 - 1 / z1);
        cam.y += sy * (1 / z0 - 1 / z1);
        cam.zoom = z1;
      }
      return;
    }

    const multiplier = event.deltaMode === 1 ? 33 : (event.deltaMode === 2 ? H : 1);
    cam.x += event.deltaX * multiplier / cam.zoom;
    cam.y += event.deltaY * multiplier / cam.zoom;
  }, { passive: false });

  function stepCam(dt) {
    if (drag || ptrs.size > 1) return;
    if (Math.hypot(cam.vx, cam.vy) < 4) {
      cam.vx = cam.vy = 0;
      return;
    }
    cam.x += cam.vx * dt;
    cam.y += cam.vy * dt;
    const f = Math.exp(-dt * 3.4);
    cam.vx *= f;
    cam.vy *= f;
  }

  const TINTS = ['#7d9b76', '#8b7fa8', '#7f96b8', '#a8927f', '#93ac86', '#b09a7c', '#a87f92', '#7fa39b', '#978fb5', '#8fa06e'];
  const ASPECTS = [1, 4 / 3, 3 / 2, 16 / 10];
  const cards = [];

  {
    let seed = 0x9e3779b9 >>> 0;
    const random = () => {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    };

    for (let i = 0; i < 54; i++) {
      const iw = Math.round(230 + random() * 290);
      const ih = Math.max(140, Math.round(iw / ASPECTS[(random() * ASPECTS.length) | 0]));
      const image = new Image();
      image.crossOrigin = 'anonymous';
      image.src = 'https://picsum.photos/seed/squichi-' + i + '/' + iw + '/' + ih;
      const card = {
        x: (random() * 2 - 1) * 3000 - iw / 2,
        y: (random() * 2 - 1) * 3000 - ih / 2,
        w: iw,
        h: ih,
        img: image,
        tint: TINTS[(random() * TINTS.length) | 0],
        ok: false
      };
      image.onload = () => { card.ok = true; };
      cards.push(card);
    }
  }

  const P = new Float64Array(256);
  const CORN = new Float64Array(8);
  const MINW = 8;
  const MINH = 7;

  function tracePoly(r) {
    const xs = [r.x, r.x + r.w, r.x + r.w, r.x];
    const ys = [r.y, r.y, r.y + r.h, r.y + r.h];
    let n = 0;

    for (let edge = 0; edge < 4; edge++) {
      const next = (edge + 1) & 3;
      const segments = Math.max(1, Math.min(10, Math.round(Math.hypot(xs[next] - xs[edge], ys[next] - ys[edge]) * cam.zoom / 120)));
      for (let i = 0; i < segments; i++) {
        const t = i / segments;
        mapPoint(xs[edge] + (xs[next] - xs[edge]) * t, ys[edge] + (ys[next] - ys[edge]) * t, TMP);
        P[n++] = TMP.x;
        P[n++] = TMP.y;
      }
    }

    for (let k = 0; k < 4; k++) {
      mapPoint(xs[k], ys[k], TMP);
      CORN[k * 2] = TMP.x;
      CORN[k * 2 + 1] = TMP.y;
    }

    let minX = 1e9;
    let minY = 1e9;
    let maxX = -1e9;
    let maxY = -1e9;
    let centerX = 0;
    let centerY = 0;

    for (let i = 0; i < n; i += 2) {
      const x = P[i];
      const y = P[i + 1];
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      centerX += x;
      centerY += y;
    }

    const count = n >> 1;
    centerX /= count;
    centerY /= count;

    const fx = Math.min(6, Math.max(1, MINW / Math.max(1e-4, maxX - minX)));
    const fy = Math.min(6, Math.max(1, MINH / Math.max(1e-4, maxY - minY)));

    if (fx > 1 || fy > 1) {
      for (let i = 0; i < n; i += 2) {
        P[i] = centerX + (P[i] - centerX) * fx;
        P[i + 1] = centerY + (P[i + 1] - centerY) * fy;
      }
      for (let k = 0; k < 8; k += 2) {
        CORN[k] = centerX + (CORN[k] - centerX) * fx;
        CORN[k + 1] = centerY + (CORN[k + 1] - centerY) * fy;
      }
    }

    ctx.beginPath();
    ctx.moveTo(P[0], P[1]);
    for (let i = 2; i < n; i += 2) ctx.lineTo(P[i], P[i + 1]);
    ctx.closePath();
  }

  let cardM = 0;

  function anchorBlend(d, c) {
    if (c <= 0) return d >= 0 ? 1 : -1;
    return Math.max(-1, Math.min(1, d / c));
  }

  function contentRect(r) {
    const qx1 = Math.min(CORN[0], CORN[2], CORN[4], CORN[6]);
    const qx2 = Math.max(CORN[0], CORN[2], CORN[4], CORN[6]);
    const qy1 = Math.min(CORN[1], CORN[3], CORN[5], CORN[7]);
    const qy2 = Math.max(CORN[1], CORN[3], CORN[5], CORN[7]);
    const bw = r.w * cam.zoom;
    const bh = r.h * cam.zoom;
    const fx = anchorBlend((qx1 + qx2) / 2 - W / 2, W / 2 * PAD - BAND);
    const fy = anchorBlend((qy1 + qy2) / 2 - H / 2, H / 2 * PAD - BAND);

    return {
      x: qx1 + (1 - fx) / 2 * ((qx2 - qx1) - bw),
      y: qy1 + (1 - fy) / 2 * ((qy2 - qy1) - bh),
      w: bw,
      h: bh
    };
  }

  function drawCard(r) {
    tracePoly(r);
    const alpha = Math.max(0.7, 1 - 0.35 * cardM);
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(54,47,38,.20)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = r.tint;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    if (r.ok && r.img.naturalWidth > 0) {
      const cr = contentRect(r);
      const k = Math.max(cr.w / r.img.naturalWidth, cr.h / r.img.naturalHeight);
      const dw = r.img.naturalWidth * k;
      const dh = r.img.naturalHeight * k;
      const bleed = 2 / DPR;
      ctx.save();
      ctx.clip();
      ctx.drawImage(r.img, cr.x + (cr.w - dw) / 2 - bleed, cr.y + (cr.h - dh) / 2 - bleed, dw + bleed * 2, dh + bleed * 2);
      ctx.restore();
    }

    ctx.globalAlpha = Math.min(1, alpha + 0.18);
    ctx.strokeStyle = 'rgba(56,50,42,.66)';
    ctx.lineWidth = 1.25;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawCards() {
    const rx = W * 0.5 * PAD;
    const ry = H * 0.5 * PAD;
    const visible = [];

    for (const r of cards) {
      const m = Math.hypot((r.x + r.w / 2 - cam.x) * cam.zoom / rx, (r.y + r.h / 2 - cam.y) * cam.zoom / ry);
      visible.push([m, r]);
    }

    visible.sort((a, b) => b[0] - a[0]);
    ctx.lineJoin = 'round';
    for (const [m, r] of visible) {
      cardM = m;
      drawCard(r);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    stepCam(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawCards();
    if (vignette) {
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
    }
    renderLens();
    requestAnimationFrame(frame);
  }

  document.querySelector('.control.close').addEventListener('click', () => {
    container.style.display = 'none';
  });

  document.querySelector('.control.minimize').addEventListener('click', () => {
    appWindow.style.transform = 'scaleY(0.055)';
    appWindow.style.transformOrigin = 'top';
    appWindow.style.transition = 'transform 180ms ease';
    setTimeout(() => { appWindow.style.transform = ''; }, 700);
  });

  document.querySelector('.control.expand').addEventListener('click', () => {
    if (document.fullscreenElement === container) {
      document.exitFullscreen?.();
    } else {
      container.requestFullscreen?.();
    }
  });

  initLens();
  resizeCanvas();
  requestAnimationFrame(frame);
  </script>
</body>
</html>
